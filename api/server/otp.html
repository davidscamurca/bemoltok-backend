<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu código de acesso</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.06);">
          <tr>
            <td style="background-color:#0a3d91; padding:24px 32px;">
              <span style="color:#ffffff; font-size:20px; font-weight:700; letter-spacing:0.5px;">BemolTok</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 8px; font-size:20px; color:#1a1a1a;">Seu código de acesso</h1>
              <p style="margin:0 0 24px; font-size:15px; line-height:1.5; color:#4a4a4a;">
                Use o código abaixo para entrar no aplicativo. Ele expira em 10 minutos.
              </p>
              <div style="text-align:center; margin:0 0 24px;">
                <span style="display:inline-block; font-size:36px; font-weight:700; letter-spacing:10px; color:#0a3d91; background-color:#eef2fb; padding:16px 24px; border-radius:10px;">{{code}}</span>
              </div>
              <p style="margin:0; font-size:13px; line-height:1.5; color:#8a8a8a;">
                Se você não solicitou este código, pode ignorar este email com segurança.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px; background-color:#fafafa; border-top:1px solid #eeeeee;">
              <p style="margin:0; font-size:12px; color:#a0a0a0;">Bemol &middot; Inteligência de Negócios</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
